[bumpversion]
current_version = 0.1.0
commit = True
tag = True
tag_name = v{new_version}
message = Bump version: {current_version} → {new_version}

# The only place the version is written; pyproject.toml reads it
# dynamically and docs/conf.py imports it.
[bumpversion:file:src/GAMIPY/__init__.py]
search = __version__ = '{current_version}'
replace = __version__ = '{new_version}'
