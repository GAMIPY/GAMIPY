# Read the Docs build configuration. The project still has to be imported
# once on readthedocs.org (see CONTRIBUTING.rst) for docs to be published.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt
